:root{--acc:#005fb8;--acch:#0a6cc4;--accbg:#e9f2fc;--accbd:#b4d3f1;--bd:#d5d5d5;--bd2:#e9e9e9;--tx:#1a1a1a;--tx2:#5d5d5d;--tx3:#8c8c8c;--bg:#f3f3f3;--pane:#fff;--hov:#f1f6fc;--sel:#d7e8f8;--selbd:#9fc9ee;--warn:#8a5300;--warnbg:#fff5d9;--warnbd:#efd48c;--err:#a4262c;--errbg:#fde7e9;--errbd:#f1b8bd;--ok:#0e700e;--okbg:#dff6dd;--chg:#9a5b00;--chgbg:#fff4e2}
*{box-sizing:border-box}
html,body{margin:0;background:#d9dde2;font-family:"Segoe UI",EWUI,"Open Sans",Tahoma,sans-serif;font-size:12px;color:var(--tx)}
body.shot{background:#fff}
button,input,select,textarea{font-family:inherit}
.tour{max-width:1124px;margin:10px auto 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#333}
.tour b{font-size:13px}
.tour select{font:inherit;padding:3px 6px;max-width:380px}
.stage{display:flex;justify-content:center;padding:0 8px 16px}
body.shot .stage{padding:0}
.win{width:1120px;height:720px;background:var(--bg);border:1px solid #8a8a8a;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.2);display:flex;flex-direction:column;position:relative;overflow:hidden}
.win.compact{width:640px;height:480px}
body.shot .win{box-shadow:none}
.title{height:32px;display:flex;align-items:center;gap:9px;padding-left:12px;flex-shrink:0;background:#f3f3f3}
.title .ico{width:16px;height:16px;border-radius:4px;background:#c4262e;color:#fff;font-weight:700;font-size:10.5px;display:flex;align-items:center;justify-content:center}
.title .cap{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.title .wb{width:46px;height:32px;display:flex;align-items:center;justify-content:center;color:#333;font-size:11px}
.title .wb.x{border-top-right-radius:7px}
.body{flex:1;display:flex;min-height:0;padding:2px 8px 0 8px;gap:8px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
/* top tabs */
.tabs{display:flex;gap:2px;padding-left:2px;flex-shrink:0;align-items:flex-end}
.tab{display:inline-flex;align-items:center;gap:7px;padding:7px 18px 8px;border:1px solid transparent;border-bottom:none;background:transparent;color:var(--tx2);cursor:pointer;border-radius:6px 6px 0 0;position:relative;white-space:nowrap;font-size:12.5px}
.tab svg{width:16px;height:16px}
.tab:hover{background:#e9e9e9;color:var(--tx)}
.tab.on{background:var(--pane);border-color:var(--bd);color:var(--tx);font-weight:600;margin-bottom:-1px;z-index:1}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:3px;border-radius:2px;background:var(--tabc,var(--acc))}
.tab .n{color:var(--tx3);font-weight:400;margin-right:-3px}
.tab.on .n{color:var(--tx2)}
.page{flex:1;background:var(--pane);border:1px solid var(--bd);border-radius:0 6px 6px 6px;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
/* sub tabs as a segmented control */
.subtabs{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--bd2);flex-shrink:0;background:#fbfbfb}
.seg-ctl{display:inline-flex;background:#ececec;border-radius:7px;padding:2px;gap:2px}
.sub{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border:none;background:transparent;color:#3d3d3d;cursor:pointer;border-radius:5px;font-size:12px;font-weight:600}
.sub svg{width:15px;height:15px}
.sub:hover{background:#e0e0e0}
.sub.on{background:#fff;color:var(--acc);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.subnote{margin-left:auto;color:var(--tx2);font-size:11.5px;display:flex;align-items:center;gap:6px}
.segbar{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--bd2);font-size:12px;flex-shrink:0;min-height:31px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:10px;color:#fff;font-weight:600;white-space:nowrap;font-size:11.5px;line-height:18px}
.stripe{height:3px;flex-shrink:0}
/* toolbars */
.tb{display:flex;align-items:center;gap:3px;padding:5px 8px;border-bottom:1px solid var(--bd2);flex-wrap:nowrap;flex-shrink:0;min-height:39px}
.tb .sep{width:1px;height:22px;background:var(--bd);margin:0 6px;flex-shrink:0}
.tb .sp{flex:1}
.grp{display:inline-flex;align-items:center;gap:2px;padding:2px 3px;border-radius:7px;background:#f5f5f5;border:1px solid #ececec;position:relative}
.b{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border:1px solid transparent;border-radius:5px;background:transparent;font:inherit;color:var(--tx);cursor:pointer;white-space:nowrap}
.b:hover{background:#e7e7e7;border-color:#dcdcdc}
.b:disabled{color:#a6a6a6;cursor:default;background:transparent;border-color:transparent}
.b svg{width:16px;height:16px;flex-shrink:0}
.b.pri{background:var(--acc);color:#fff;border-color:#004c93}
.b.pri:hover{background:var(--acch)}
.b.std{background:#fdfdfd;border-color:#cbcbcb;padding:0 14px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.b.std:hover{background:#f2f2f2}
.b.seg{background:var(--accbg);border-color:var(--accbd);color:#0b4a8c;font-weight:600}
.b.learn{background:#e3eefa;border-color:#8fb8e3;color:#0b4a8c;font-weight:600}
.b.learn:hover{background:#d3e4f7}
.b.on{background:var(--sel);border-color:var(--selbd)}
.b.danger{background:#a4262c;color:#fff;border-color:#7d1c21}
.splitb{display:inline-flex}
.splitb .b:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.splitb .b+.b{border-top-left-radius:0;border-bottom-left-radius:0;border-left-color:#b9d3ee;padding:0 5px}
.combo{height:26px;border:1px solid #c9c9c9;border-radius:5px;background:#fff;font:inherit;padding:0 6px;color:var(--tx)}
.search{display:flex;align-items:center;gap:5px;height:26px;border:1px solid #c9c9c9;border-bottom-color:#9a9a9a;border-radius:5px;background:#fff;padding:0 7px;width:190px;color:var(--tx2)}
.search svg{width:14px;height:14px;flex-shrink:0}
.search input{border:none;outline:none;font:inherit;flex:1;min-width:0;background:transparent;color:var(--tx)}
/* grids */
.grid{flex:1;overflow:auto;min-height:0;position:relative}
table.g{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
table.g th{position:sticky;top:0;background:#fafafa;text-align:left;font-weight:400;color:var(--tx2);border-bottom:1px solid var(--bd);padding:4px 7px;height:25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}
table.g th+th{border-left:1px solid var(--bd2)}
table.g td{padding:0 7px;height:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #f3f3f3}
table.g tr.r{cursor:default}
table.g tr.r:hover td{background:var(--hov)}
table.g tr.r.s td{background:var(--sel)}
table.g td.bar{padding:0;width:4px}
table.g tr.dim td{color:#a3a3a3}
table.g tr.end td{color:var(--tx3)}
table.g tr.gh td{background:#f6f7f8;font-weight:600;height:26px;border-bottom:1px solid var(--bd2);cursor:pointer}
table.g tr.gh:hover td{background:#eef1f4}
table.g tr.gh td .gmeta{font-weight:400;color:var(--tx2);margin-left:8px}
.ty{display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis}
.ty svg{width:15px;height:15px;color:#5a6b7c;flex-shrink:0}
.rowact{display:none;gap:1px;justify-content:flex-end}
tr.s .rowact{display:flex}
.rowact .ib{width:22px;height:20px}
td.actc{padding:0 4px}
.win.compact .rowact .ib{width:28px;height:26px}
.win.compact .rowact .ib svg{width:17px;height:17px}
/* footer + status */
.foot{display:flex;align-items:center;gap:8px;padding:7px 8px;flex-shrink:0}
.foot .sp{flex:1}
.status{height:25px;display:flex;align-items:center;border-top:1px solid var(--bd);background:#f7f7f7;font-size:11.5px;color:#444;flex-shrink:0}
.status span{padding:0 10px;border-right:1px solid var(--bd2);white-space:nowrap;display:flex;align-items:center;gap:5px}
.status span:last-child{border-right:none}
.status svg{width:13px;height:13px;color:#666}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0}
/* segment rail */
.rail{width:268px;flex-shrink:0;background:var(--pane);border:1px solid var(--bd);border-radius:6px;display:flex;flex-direction:column;min-height:0;margin-top:2px;overflow:hidden}

.tree{flex:1;overflow:auto;padding:4px 0 6px;position:relative}
.rrow{display:flex;align-items:center;gap:6px;padding:7px 6px 7px 22px;min-height:46px;cursor:pointer;position:relative;border-left:4px solid transparent}

.rrow .nm span{font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rail .ft{border-top:1px solid var(--bd2);padding:8px;display:flex;flex-direction:column;gap:6px;background:#fbfbfb}
.legend{font-size:10.5px;color:var(--tx2);line-height:1.45;display:flex;flex-direction:column;gap:2px}
.legend span{display:flex;align-items:center;gap:6px}
/* menus */
.menu{position:absolute;background:#fff;border:1px solid #c4c4c4;border-radius:8px;box-shadow:0 8px 26px rgba(0,0,0,.18);padding:4px;z-index:30;min-width:210px}
.menu .mi{display:flex;align-items:center;gap:9px;width:100%;padding:6px 10px;border:none;background:transparent;font:inherit;border-radius:5px;cursor:pointer;text-align:left;color:var(--tx)}
.menu .mi:hover{background:var(--hov)}
.menu .mi:disabled{color:#a6a6a6;cursor:default;background:transparent}
.menu .mi svg{width:16px;height:16px;color:#555}
.menu .mi .k{margin-left:auto;color:#888;font-size:11px;padding-left:14px}
.menu .mi.danger{color:var(--err)}
.menu .mh{padding:4px 10px 2px;font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.menu hr{border:none;border-top:1px solid var(--bd2);margin:4px 2px}
.pop{position:absolute;background:#fff;border:1px solid #c4c4c4;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:31;padding:12px 14px;display:flex;flex-direction:column;gap:9px}

.overlay{position:absolute;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;z-index:40}

.dlg .db{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;background:#f7f7f7;border-top:1px solid var(--bd2)}

.cat .ch .t{font-weight:600;min-width:150px}

.cat.open>.ch{border-bottom:1px solid var(--bd2);border-radius:7px 7px 0 0}
.badge{font-size:10.5px;padding:1px 8px;border-radius:9px;background:var(--chgbg);color:var(--chg);font-weight:600;white-space:nowrap;border:1px solid #f1d9ad}
.badge.blue{background:var(--accbg);color:#0b4a8c;border-color:var(--accbd)}
.badge.gray{background:#f0f0f0;color:#555;border-color:#e0e0e0}
.badge.custom{background:#f3ecfb;color:#5b2f99;border-color:#dccbf3}

.prow{display:grid;grid-template-columns:minmax(160px,230px) 130px 1fr;align-items:center;gap:8px;min-height:26px}

.prow.chg{background:var(--chgbg);border-radius:5px;margin:0 -6px;padding:0 6px}
.prow.chg .src{color:var(--chg);font-weight:600}
.prow.dis{opacity:.45}
.learnflag{font-size:10px;color:#0b4a8c;background:var(--accbg);border:1px solid var(--accbd);border-radius:8px;padding:0 6px;margin-left:6px;font-weight:600}
.opt{display:flex;align-items:center;gap:7px}

.toggle{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;white-space:nowrap}

.beh{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;align-items:center}

.beh select.combo{width:280px}
.beh .note{grid-column:2;font-size:11px;color:var(--tx2);margin-top:-3px}

.presetbar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;background:#f7f9fb;border:1px solid #e4e9ef}

table.cmp{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}

table.cmp th{position:sticky;top:0;background:#fafafa;font-weight:600;border-bottom:1px solid var(--bd);height:34px;z-index:2}
table.cmp td.grpcell{background:#f6f7f8;font-weight:600;color:#444;height:24px}
table.cmp td.d{background:var(--chgbg);color:var(--chg);font-weight:600}
table.cmp td.same{color:#9a9a9a}
table.cmp td:first-child{color:#333}
/* side panel */
.side{width:232px;flex-shrink:0;border-left:1px solid var(--bd2);display:flex;flex-direction:column;background:#fbfbfb}
.side h4{margin:0;padding:8px 10px;font-size:12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--bd2);min-height:37px}
.side .sb{padding:9px 10px;overflow:auto;display:flex;flex-direction:column;gap:9px}
.side .kv{display:grid;grid-template-columns:88px 1fr;gap:3px 6px;font-size:11.5px}
.side .kv span:nth-child(odd){color:var(--tx2)}
.side .sec{font-weight:600;font-size:11.5px;display:flex;align-items:center;gap:6px}
.side .sec svg{width:13px;height:13px}
.side .chg{color:var(--chg);font-weight:600}
.sidecol{width:24px;flex-shrink:0;border-left:1px solid var(--bd2);display:flex;flex-direction:column;align-items:center;padding-top:6px;background:#fbfbfb}
.vt{writing-mode:vertical-rl;font-size:11px;color:var(--tx2);margin-top:8px}
/* run plan */
.plan{display:flex;gap:0;align-items:stretch;flex-wrap:nowrap}
.step{flex:1 1 0;border:1px solid var(--bd);border-radius:7px;padding:9px 11px;display:flex;flex-direction:column;gap:6px;background:#fff;min-width:0}
.step.tog{border-color:#a9cdee;background:#f5faff}
.step .sh{font-weight:600;display:flex;gap:6px;align-items:center}
.step .why{font-size:11px;color:var(--tx2);line-height:1.4}
.arrow{display:flex;align-items:center;padding:0 6px;color:#9a9a9a}
.arrow svg{width:16px;height:16px}
/* connections */
.pts{display:flex;flex-direction:column;gap:7px}
.ptg .ptl{font-size:11px;color:var(--tx2);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.ptg .ptl b{color:#333}
.ptc{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px}
.pt{height:19px;font-size:9.5px;display:flex;align-items:center;justify-content:center;border-radius:3px;background:#fff;color:#888;box-shadow:inset 0 0 0 1px #d5dbe1}
.pt.on{background:#d3e5f7;color:#0b4a8c;box-shadow:none}
.pt.sel{outline:2px solid var(--acc);outline-offset:-1px;font-weight:700}
.pt.wait{background:#fff;outline:1.5px dashed #e09a00;outline-offset:-2px;color:#b36b00;box-shadow:none}
.pic{position:relative;display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 12px;border-bottom:1px solid var(--bd2);background:linear-gradient(#fbfcfd,#f4f6f8);flex-shrink:0}
.pic svg.conn{display:block}
.pic .picmeta{position:absolute;left:12px;top:9px;display:flex;flex-direction:column;gap:2px}
.pic .picmeta b{font-size:13px}
.pic .picmeta span{font-size:11px;color:var(--tx2)}
.pic .pictools{position:absolute;right:10px;top:8px;display:flex;align-items:center;gap:8px}
.pic .legendp{position:absolute;left:12px;bottom:8px;display:flex;gap:12px;font-size:10.5px;color:var(--tx2)}
.pic .legendp span{display:flex;align-items:center;gap:5px}
.lg{width:11px;height:11px;border-radius:6px;display:inline-block;border:1.5px solid #7a8a99;background:#fff}
.lg.a{background:#2f6db5;border-color:#2f6db5}
.lg.s{background:#fff;border:2.5px solid #f2a000}
.probe{display:flex;align-items:center;gap:10px;padding:7px 10px;background:#fff8e1;border-bottom:1px solid #f0d58a;flex-shrink:0}
.probe .pulse{width:10px;height:10px;border-radius:5px;background:#f2a000;box-shadow:0 0 0 4px rgba(242,160,0,.25)}
.cellin{height:20px;width:100%;border:1px solid transparent;border-radius:3px;padding:0 5px;font:inherit;background:transparent}
tr.r:hover .cellin{border-color:#d6d6d6;background:#fff}

.stat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;vertical-align:middle}

.stat.ok{color:var(--ok)}
.stat.no{color:#9a9a9a}
.stat.wt{color:#b36b00;font-weight:600}
.att{display:inline-block;min-width:44px;text-align:center;padding:0 6px;border-radius:9px;font-size:11px;background:#eef1f5;color:#444}
.att.full{background:#e3f1e2;color:#0e600e}
.att.part{background:#fff3d6;color:#8a5300}

.hide{display:none!important}
.lnk{color:var(--acc);background:none;border:none;font:inherit;padding:0;cursor:pointer;text-decoration:underline}

.scard span{color:var(--tx2);font-size:11.5px}
.txt{white-space:pre;font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:11.5px;line-height:1.5;background:#fbfbfb;border:1px solid var(--bd2);border-radius:6px;padding:10px 12px;overflow:auto;color:#222}
.txt .k{color:#0b4a8c;font-weight:700}
.txt .c{color:#6a737d}
.txt .s{color:#8a3b00}

.cb .fld select.combo{max-width:340px}
.tb .opt{white-space:nowrap}

.rrow .mo{display:none}
.rrow:hover .mo,.rrow.focus .mo{display:inline-flex}
.rrow .nm .fl{display:flex;align-items:center;gap:5px;min-width:0}

.chgd{width:7px;height:7px;border-radius:4px;background:#b86b00;flex-shrink:0;display:inline-block}
.pr{display:inline-flex;color:#6b5a3a;flex-shrink:0}

.scard b{white-space:nowrap}

.grpcell span{font-weight:400;color:#6b6b6b;font-size:11px;margin-left:10px;text-transform:none;letter-spacing:0}
.numf{display:inline-flex;align-items:stretch}

  const hl = st.hl ? `<circle cx="${x}" cy="${y}" r="${r + 1.5}" fill="none" stroke="${st.hl}" stroke-width="2.5"/>` : '';
  const body = shape === 'sq' ? `<rect x="${x - r}" y="${y - r}" width="${2 * r}" height="${2 * r}" rx="3" fill="${fill}" stroke="${stc}" stroke-width="1.4"/>` : `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stc}" stroke-width="1.4"/>`;
  return `<g data-a="pin" data-id="${n}" style="cursor:pointer">${ring}${hl}${body}<text x="${x}" y="${y + 3.6}" text-anchor="middle" font-size="${r > 9 ? 10.5 : 9}" font-weight="600" fill="${tx}" font-family="Segoe UI,EWUI,sans-serif">${n}</text></g>`;
}

    const g = {}; Object.keys(parent).forEach((p) => { (g[find(p)] = g[find(p)] || []).push(p); });
    Object.keys(g).forEach((k) => { const pts = g[k].sort(); rows.push({ name: 'Net' + nn++, pts, s, src: list.filter((i) => ['WIRE', 'TWISTED PAIR'].indexOf(i.t) >= 0 && (pts.indexOf(i.f) >= 0 || (i.t === 'TWISTED PAIR' && pts.some((p) => i.p.indexOf(p + ' ') >= 0 || i.p.endsWith(p))))), hv: s && s.ov.dw ? 'Group 2 (' + s.ov.dw + ')' : 'Default' }); });

    rows.length = 0;
    const scope = vm === 'base' ? [null] : (vm === 'single' ? [segs()[0]] : shownSegs());
    scope.forEach((s) => {
      const list = s ? s.instr.concat(s.base ? S.d.base : []) : S.d.base;
      const comps = list.filter((i) => ['DIODE', 'RESISTOR', 'CAPACITOR'].indexOf(i.t) >= 0);
      if (S.netTab === 'comp') comps.forEach((i) => rows.push({ name: i.label || i.t, pts: [i.f, i.to], s, src: [i], hv: 'Default', note: i.t + (i.p ? ', ' + i.p : '') }));

  return `<div class="tb">${sub}${btn('info', 'Details', 'noop', { tip: 'Net details' })}${btn('hv', 'HV for Selected ▾', 'dd', { id: 'hvctl', tip: 'HV control: Off, On, High Cap' })}<div class="sp"></div>${S.compact ? '' : `<div class="search" style="width:160px">${IC.search}<input placeholder="Search nets"></div>`}${btn('text', S.compact ? '' : 'Text View', 'textView', { tip: 'Text View of the nets' })}${btn('more', S.compact ? '' : 'More', 'dd', { id: 'netmore', tip: 'Customize High Voltage Test By Net' })}</div>
  ${vm === 'seg' && focusSeg().base ? `<div class="segbar" style="color:#555">${dot(BASEC)} Includes shared wiring nets. This is what the tester expects while this segment runs.</div>` : ''}
  <div style="padding:6px 10px;color:#5d5d5d;border-bottom:1px solid #eee;font-size:11.5px">Nets come from the instructions. Use them to check the net structure and set up custom hipot groups.</div>
  <div class="split"><div class="pane" style="flex:1"><div class="grid"><table class="g"><colgroup>${m ? '<col style="width:4px">' : ''}<col style="width:90px"><col style="width:52px"><col><col style="width:150px">${showSeg ? '<col style="width:140px">' : ''}</colgroup><tr>${m ? '<th></th>' : ''}<th>Name</th><th>Count</th><th>Points</th><th>Hipot parameter group</th>${showSeg ? '<th>Segment</th>' : ''}</tr>${tr}</table></div></div>${S.compact || !rows.length ? '' : netSide(rows[ns])}</div>`;
