:root{--acc:#005fb8;--acch:#0a6cc4;--accbg:#e9f2fc;--accbd:#b4d3f1;--bd:#d5d5d5;--bd2:#e9e9e9;--tx:#1a1a1a;--tx2:#5d5d5d;--tx3:#8c8c8c;--bg:#f3f3f3;--pane:#fff;--hov:#f1f6fc;--sel:#d7e8f8;--selbd:#9fc9ee;--warn:#8a5300;--warnbg:#fff5d9;--warnbd:#efd48c;--err:#a4262c;--errbg:#fde7e9;--errbd:#f1b8bd;--ok:#0e700e;--okbg:#dff6dd;--chg:#9a5b00;--chgbg:#fff4e2}
*{box-sizing:border-box}
html,body{margin:0;background:#d9dde2;font-family:"Segoe UI",EWUI,"Open Sans",Tahoma,sans-serif;font-size:12px;color:var(--tx)}
body.shot{background:#fff}
button,input,select,textarea{font-family:inherit}
.tour{max-width:1124px;margin:10px auto 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#333}
.tour b{font-size:13px}
.tour select{font:inherit;padding:3px 6px;max-width:380px}
.stage{display:flex;justify-content:center;padding:0 8px 16px}
body.shot .stage{padding:0}
.win{width:1120px;height:720px;background:var(--bg);border:1px solid #8a8a8a;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.2);display:flex;flex-direction:column;position:relative;overflow:hidden}
.win.compact{width:640px;height:480px}
body.shot .win{box-shadow:none}
.title{height:32px;display:flex;align-items:center;gap:9px;padding-left:12px;flex-shrink:0;background:#f3f3f3}
.title .ico{width:16px;height:16px;border-radius:4px;background:#c4262e;color:#fff;font-weight:700;font-size:10.5px;display:flex;align-items:center;justify-content:center}
.title .cap{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.title .wb{width:46px;height:32px;display:flex;align-items:center;justify-content:center;color:#333;font-size:11px}
.title .wb.x{border-top-right-radius:7px}
.body{flex:1;display:flex;min-height:0;padding:2px 8px 0 8px;gap:8px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
/* top tabs */
.tabs{display:flex;gap:2px;padding-left:2px;flex-shrink:0;align-items:flex-end}
.tab{display:inline-flex;align-items:center;gap:7px;padding:7px 18px 8px;border:1px solid transparent;border-bottom:none;background:transparent;color:var(--tx2);cursor:pointer;border-radius:6px 6px 0 0;position:relative;white-space:nowrap;font-size:12.5px}
.tab svg{width:16px;height:16px}
.tab:hover{background:#e9e9e9;color:var(--tx)}
.tab.on{background:var(--pane);border-color:var(--bd);color:var(--tx);font-weight:600;margin-bottom:-1px;z-index:1}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:3px;border-radius:2px;background:var(--tabc,var(--acc))}
.tab .n{color:var(--tx3);font-weight:400;margin-right:-3px}
.tab.on .n{color:var(--tx2)}
.page{flex:1;background:var(--pane);border:1px solid var(--bd);border-radius:0 6px 6px 6px;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
/* sub tabs as a segmented control */
.subtabs{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--bd2);flex-shrink:0;background:#fbfbfb}
.seg-ctl{display:inline-flex;background:#ececec;border-radius:7px;padding:2px;gap:2px}
.sub{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border:none;background:transparent;color:#3d3d3d;cursor:pointer;border-radius:5px;font-size:12px;font-weight:600}
.sub svg{width:15px;height:15px}
.sub:hover{background:#e0e0e0}
.sub.on{background:#fff;color:var(--acc);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.subnote{margin-left:auto;color:var(--tx2);font-size:11.5px;display:flex;align-items:center;gap:6px}
.segbar{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--bd2);font-size:12px;flex-shrink:0;min-height:31px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:10px;color:#fff;font-weight:600;white-space:nowrap;font-size:11.5px;line-height:18px}
.stripe{height:3px;flex-shrink:0}
/* toolbars */
.tb{display:flex;align-items:center;gap:3px;padding:5px 8px;border-bottom:1px solid var(--bd2);flex-wrap:nowrap;flex-shrink:0;min-height:39px}
.tb .sep{width:1px;height:22px;background:var(--bd);margin:0 6px;flex-shrink:0}
.tb .sp{flex:1}
.grp{display:inline-flex;align-items:center;gap:2px;padding:2px 3px;border-radius:7px;background:#f5f5f5;border:1px solid #ececec;position:relative}
.b{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border:1px solid transparent;border-radius:5px;background:transparent;font:inherit;color:var(--tx);cursor:pointer;white-space:nowrap}
.b:hover{background:#e7e7e7;border-color:#dcdcdc}
.b:disabled{color:#a6a6a6;cursor:default;background:transparent;border-color:transparent}
.b svg{width:16px;height:16px;flex-shrink:0}
.b.pri{background:var(--acc);color:#fff;border-color:#004c93}
.b.pri:hover{background:var(--acch)}
.b.std{background:#fdfdfd;border-color:#cbcbcb;padding:0 14px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.b.std:hover{background:#f2f2f2}
.b.seg{background:var(--accbg);border-color:var(--accbd);color:#0b4a8c;font-weight:600}
.b.learn{background:#e3eefa;border-color:#8fb8e3;color:#0b4a8c;font-weight:600}
.b.learn:hover{background:#d3e4f7}
.b.on{background:var(--sel);border-color:var(--selbd)}
.b.danger{background:#a4262c;color:#fff;border-color:#7d1c21}
.splitb{display:inline-flex}
.splitb .b:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.splitb .b+.b{border-top-left-radius:0;border-bottom-left-radius:0;border-left-color:#b9d3ee;padding:0 5px}
.combo{height:26px;border:1px solid #c9c9c9;border-radius:5px;background:#fff;font:inherit;padding:0 6px;color:var(--tx)}
.search{display:flex;align-items:center;gap:5px;height:26px;border:1px solid #c9c9c9;border-bottom-color:#9a9a9a;border-radius:5px;background:#fff;padding:0 7px;width:190px;color:var(--tx2)}
.search svg{width:14px;height:14px;flex-shrink:0}
.search input{border:none;outline:none;font:inherit;flex:1;min-width:0;background:transparent;color:var(--tx)}
/* grids */
.grid{flex:1;overflow:auto;min-height:0;position:relative}
table.g{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
table.g th{position:sticky;top:0;background:#fafafa;text-align:left;font-weight:400;color:var(--tx2);border-bottom:1px solid var(--bd);padding:4px 7px;height:25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}
table.g th+th{border-left:1px solid var(--bd2)}
table.g td{padding:0 7px;height:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #f3f3f3}
table.g tr.r{cursor:default}
table.g tr.r:hover td{background:var(--hov)}
table.g tr.r.s td{background:var(--sel)}
table.g td.bar{padding:0;width:4px}
table.g tr.dim td{color:#a3a3a3}
table.g tr.end td{color:var(--tx3)}
table.g tr.gh td{background:#f6f7f8;font-weight:600;height:26px;border-bottom:1px solid var(--bd2);cursor:pointer}
table.g tr.gh:hover td{background:#eef1f4}
table.g tr.gh td .gmeta{font-weight:400;color:var(--tx2);margin-left:8px}
.ty{display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis}
.ty svg{width:15px;height:15px;color:#5a6b7c;flex-shrink:0}
.rowact{display:none;gap:1px;justify-content:flex-end}
tr.s .rowact{display:flex}
.rowact .ib{width:22px;height:20px}
td.actc{padding:0 4px}
.win.compact .rowact .ib{width:28px;height:26px}
.win.compact .rowact .ib svg{width:17px;height:17px}
/* footer + status */
.foot{display:flex;align-items:center;gap:8px;padding:7px 8px;flex-shrink:0}
.foot .sp{flex:1}
.status{height:25px;display:flex;align-items:center;border-top:1px solid var(--bd);background:#f7f7f7;font-size:11.5px;color:#444;flex-shrink:0}
.status span{padding:0 10px;border-right:1px solid var(--bd2);white-space:nowrap;display:flex;align-items:center;gap:5px}
.status span:last-child{border-right:none}
.status svg{width:13px;height:13px;color:#666}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0}
/* segment rail */
.rail{width:268px;flex-shrink:0;background:var(--pane);border:1px solid var(--bd);border-radius:6px;display:flex;flex-direction:column;min-height:0;margin-top:2px;overflow:hidden}
.grow{display:flex;align-items:center;gap:9px;padding:10px 10px 10px 12px;cursor:pointer;border-left:4px solid transparent;border-bottom:1px solid var(--bd2)}
.grow:hover{background:var(--hov)}
.grow.focus{background:#e9f2fc;border-left-color:var(--acc)}
.grow .gi{width:28px;height:28px;border-radius:7px;background:#eef1f5;display:flex;align-items:center;justify-content:center;color:#3b4a5a;flex-shrink:0}
.grow .gi svg{width:17px;height:17px}
.grow .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.grow .nm b{font-size:13px;font-weight:600}
.grow .nm span{font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree{flex:1;overflow:auto;padding:4px 0 6px;position:relative}
.rrow{display:flex;align-items:center;gap:6px;padding:7px 6px 7px 22px;min-height:46px;cursor:pointer;position:relative;border-left:4px solid transparent}
.rrow::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:1px;background:#dcdcdc}
.rrow::after{content:"";position:absolute;left:13px;top:50%;width:6px;height:1px;background:#dcdcdc}
.rrow.last::before{bottom:50%}
.rrow:hover{background:var(--hov)}
.rrow.focus{background:var(--rbg)}
.rrow .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rrow .nm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .nm span{font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .nm .off{color:#9a9a9a;text-decoration:line-through}
.rrow.base .nm b{color:#555}
.ib{width:26px;height:24px;border:1px solid transparent;border-radius:5px;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#444;flex-shrink:0;padding:0}
.ib:hover{background:#e5e5e5}
.ib svg{width:16px;height:16px}
.mini{width:28px;height:15px;border-radius:8px;border:1px solid #777;background:#fff;position:relative;flex-shrink:0;cursor:pointer;padding:0}
.mini::after{content:"";position:absolute;top:2px;left:2px;width:9px;height:9px;border-radius:5px;background:#666}
.mini.on{background:var(--acc);border-color:var(--acc)}
.mini.on::after{left:15px;background:#fff}
.rail .ft{border-top:1px solid var(--bd2);padding:8px;display:flex;flex-direction:column;gap:6px;background:#fbfbfb}
.legend{font-size:10.5px;color:var(--tx2);line-height:1.45;display:flex;flex-direction:column;gap:2px}
.legend span{display:flex;align-items:center;gap:6px}
/* menus */
.menu{position:absolute;background:#fff;border:1px solid #c4c4c4;border-radius:8px;box-shadow:0 8px 26px rgba(0,0,0,.18);padding:4px;z-index:30;min-width:210px}
.menu .mi{display:flex;align-items:center;gap:9px;width:100%;padding:6px 10px;border:none;background:transparent;font:inherit;border-radius:5px;cursor:pointer;text-align:left;color:var(--tx)}
.menu .mi:hover{background:var(--hov)}
.menu .mi:disabled{color:#a6a6a6;cursor:default;background:transparent}
.menu .mi svg{width:16px;height:16px;color:#555}
.menu .mi .k{margin-left:auto;color:#888;font-size:11px;padding-left:14px}
.menu .mi.danger{color:var(--err)}
.menu .mh{padding:4px 10px 2px;font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.menu hr{border:none;border-top:1px solid var(--bd2);margin:4px 2px}
.pop{position:absolute;background:#fff;border:1px solid #c4c4c4;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:31;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
/* dialogs */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;z-index:40}
.dlg{background:#fff;border:1px solid #8c8c8c;border-radius:8px;box-shadow:0 14px 44px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:96%;overflow:hidden}
.dlg .dt{height:34px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;border-bottom:1px solid var(--bd2)}
.dlg .dt .cap{flex:1}
.dlg .dc{padding:14px 16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.dlg .db{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;background:#f7f7f7;border-top:1px solid var(--bd2)}
.dlg .db .b{min-width:84px;justify-content:center}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>label,.lbl{font-weight:600;font-size:12px}
.edit{height:26px;border:1px solid #c9c9c9;border-bottom-color:#8a8a8a;border-radius:5px;padding:0 7px;font:inherit;background:#fff;color:var(--tx)}
.edit:disabled{background:#f5f5f5;color:#8a8a8a;border-bottom-color:#c9c9c9}
.edit.num{width:110px}
.radio{display:flex;align-items:center;gap:7px;cursor:pointer}
.radio input{accent-color:var(--acc);margin:0}
.info{display:block;padding:8px 10px;border-radius:5px;background:#eef5fc;border:1px solid #c7def5;line-height:1.45}
.info.warn{background:var(--warnbg);border-color:var(--warnbd)}
.info.err{background:var(--errbg);border-color:var(--errbd)}
.info.ok{background:var(--okbg);border-color:#a6dba3}
.info svg{width:16px;height:16px;vertical-align:-3px;margin-right:7px}
.dtabs{display:flex;gap:2px;padding:8px 16px 0}
/* settings */
.cat{border:1px solid var(--bd);border-radius:7px;background:#fff}
.cat+.cat{margin-top:8px}
.cat .ch{display:flex;align-items:center;gap:9px;padding:8px 10px;cursor:pointer;border-radius:7px;min-height:36px}
.cat .ch:hover{background:#f7f7f7}
.cat .ch>svg{width:14px;height:14px;flex-shrink:0;color:#555}
.cat .ch .ci{width:22px;height:22px;border-radius:6px;background:#eef1f5;display:flex;align-items:center;justify-content:center;color:#3b4a5a;flex-shrink:0}
.cat .ch .ci svg{width:14px;height:14px}
.cat .ch .t{font-weight:600;min-width:150px}
.cat .ch .sum{flex:1;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat.open>.ch{border-bottom:1px solid var(--bd2);border-radius:7px 7px 0 0}
.badge{font-size:10.5px;padding:1px 8px;border-radius:9px;background:var(--chgbg);color:var(--chg);font-weight:600;white-space:nowrap;border:1px solid #f1d9ad}
.badge.blue{background:var(--accbg);color:#0b4a8c;border-color:var(--accbd)}
.badge.gray{background:#f0f0f0;color:#555;border-color:#e0e0e0}
.badge.custom{background:#f3ecfb;color:#5b2f99;border-color:#dccbf3}
.cat .cb{padding:10px 12px 12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px}
.cat .cb.one{grid-template-columns:1fr}
.prow{display:grid;grid-template-columns:minmax(160px,230px) 130px 1fr;align-items:center;gap:8px;min-height:26px}
.prow .src{font-size:11px;color:var(--tx2)}
.prow.chg{background:var(--chgbg);border-radius:5px;margin:0 -6px;padding:0 6px}
.prow.chg .src{color:var(--chg);font-weight:600}
.prow.dis{opacity:.45}
.learnflag{font-size:10px;color:#0b4a8c;background:var(--accbg);border:1px solid var(--accbd);border-radius:8px;padding:0 6px;margin-left:6px;font-weight:600}
.opt{display:flex;align-items:center;gap:7px}
.opt input{accent-color:var(--acc);margin:0}
.toggle{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;white-space:nowrap}
.toggle .sw{width:34px;height:18px;border-radius:9px;border:1px solid #6b6b6b;background:#fff;position:relative;flex-shrink:0}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:10px;height:10px;border-radius:5px;background:#555}
.toggle.on .sw{background:var(--acc);border-color:var(--acc)}
.toggle.on .sw::after{left:19px;background:#fff}
.beh{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;align-items:center}
.beh .bl{color:#333}
.beh .bl.chg{color:var(--chg);font-weight:600}
.beh select.combo{width:280px}
.beh .note{grid-column:2;font-size:11px;color:var(--tx2);margin-top:-3px}
.beh .note.err{color:var(--err);font-weight:600}
.presetbar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;background:#f7f9fb;border:1px solid #e4e9ef}
/* compare */
table.cmp{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
table.cmp th,table.cmp td{padding:0 9px;height:25px;border-bottom:1px solid #f0f0f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
table.cmp th{position:sticky;top:0;background:#fafafa;font-weight:600;border-bottom:1px solid var(--bd);height:34px;z-index:2}
table.cmp td.grpcell{background:#f6f7f8;font-weight:600;color:#444;height:24px}
table.cmp td.d{background:var(--chgbg);color:var(--chg);font-weight:600}
table.cmp td.same{color:#9a9a9a}
table.cmp td:first-child{color:#333}
/* side panel */
.side{width:232px;flex-shrink:0;border-left:1px solid var(--bd2);display:flex;flex-direction:column;background:#fbfbfb}
.side h4{margin:0;padding:8px 10px;font-size:12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--bd2);min-height:37px}
.side .sb{padding:9px 10px;overflow:auto;display:flex;flex-direction:column;gap:9px}
.side .kv{display:grid;grid-template-columns:88px 1fr;gap:3px 6px;font-size:11.5px}
.side .kv span:nth-child(odd){color:var(--tx2)}
.side .sec{font-weight:600;font-size:11.5px;display:flex;align-items:center;gap:6px}
.side .sec svg{width:13px;height:13px}
.side .chg{color:var(--chg);font-weight:600}
.sidecol{width:24px;flex-shrink:0;border-left:1px solid var(--bd2);display:flex;flex-direction:column;align-items:center;padding-top:6px;background:#fbfbfb}
.vt{writing-mode:vertical-rl;font-size:11px;color:var(--tx2);margin-top:8px}
/* run plan */
.plan{display:flex;gap:0;align-items:stretch;flex-wrap:nowrap}
.step{flex:1 1 0;border:1px solid var(--bd);border-radius:7px;padding:9px 11px;display:flex;flex-direction:column;gap:6px;background:#fff;min-width:0}
.step.tog{border-color:#a9cdee;background:#f5faff}
.step .sh{font-weight:600;display:flex;gap:6px;align-items:center}
.step .why{font-size:11px;color:var(--tx2);line-height:1.4}
.arrow{display:flex;align-items:center;padding:0 6px;color:#9a9a9a}
.arrow svg{width:16px;height:16px}
/* connections */
.pts{display:flex;flex-direction:column;gap:7px}
.ptg .ptl{font-size:11px;color:var(--tx2);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.ptg .ptl b{color:#333}
.ptc{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px}
.pt{height:19px;font-size:9.5px;display:flex;align-items:center;justify-content:center;border-radius:3px;background:#fff;color:#888;box-shadow:inset 0 0 0 1px #d5dbe1}
.pt.on{background:#d3e5f7;color:#0b4a8c;box-shadow:none}
.pt.sel{outline:2px solid var(--acc);outline-offset:-1px;font-weight:700}
.pt.wait{background:#fff;outline:1.5px dashed #e09a00;outline-offset:-2px;color:#b36b00;box-shadow:none}
.pic{position:relative;display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 12px;border-bottom:1px solid var(--bd2);background:linear-gradient(#fbfcfd,#f4f6f8);flex-shrink:0}
.pic svg.conn{display:block}
.pic .picmeta{position:absolute;left:12px;top:9px;display:flex;flex-direction:column;gap:2px}
.pic .picmeta b{font-size:13px}
.pic .picmeta span{font-size:11px;color:var(--tx2)}
.pic .pictools{position:absolute;right:10px;top:8px;display:flex;align-items:center;gap:8px}
.pic .legendp{position:absolute;left:12px;bottom:8px;display:flex;gap:12px;font-size:10.5px;color:var(--tx2)}
.pic .legendp span{display:flex;align-items:center;gap:5px}
.lg{width:11px;height:11px;border-radius:6px;display:inline-block;border:1.5px solid #7a8a99;background:#fff}
.lg.a{background:#2f6db5;border-color:#2f6db5}
.lg.s{background:#fff;border:2.5px solid #f2a000}
.probe{display:flex;align-items:center;gap:10px;padding:7px 10px;background:#fff8e1;border-bottom:1px solid #f0d58a;flex-shrink:0}
.probe .pulse{width:10px;height:10px;border-radius:5px;background:#f2a000;box-shadow:0 0 0 4px rgba(242,160,0,.25)}
.cellin{height:20px;width:100%;border:1px solid transparent;border-radius:3px;padding:0 5px;font:inherit;background:transparent}
tr.r:hover .cellin{border-color:#d6d6d6;background:#fff}
tr.s .cellin{border-color:#9fc9ee;background:#fff}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;vertical-align:middle}
.stat svg{width:13px;height:13px}
.stat.ok{color:var(--ok)}
.stat.no{color:#9a9a9a}
.stat.wt{color:#b36b00;font-weight:600}
.att{display:inline-block;min-width:44px;text-align:center;padding:0 6px;border-radius:9px;font-size:11px;background:#eef1f5;color:#444}
.att.full{background:#e3f1e2;color:#0e600e}
.att.part{background:#fff3d6;color:#8a5300}
/* misc */
.undo{display:flex;align-items:center;gap:10px;padding:7px 10px;background:#eef5fc;border-bottom:1px solid #c7def5;flex-shrink:0;line-height:1.4}
.undo .sp{flex:1}
.hide{display:none!important}
.lnk{color:var(--acc);background:none;border:none;font:inherit;padding:0;cursor:pointer;text-decoration:underline}
.colhead{display:flex;align-items:center;gap:8px;padding:0 8px;font-weight:600;border-bottom:1px solid var(--bd2);min-height:37px}
.colhead span{font-weight:400;color:var(--tx2)}
.split{flex:1;display:flex;min-height:0}
.split>.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.split>.pane+.pane{border-left:1px solid var(--bd)}
.start{position:absolute;inset:32px 0 0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.card{width:310px;text-align:left;padding:15px 17px;background:#fff;border:1px solid var(--bd);border-radius:9px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--acc);background:#f6faff}
.card b{font-size:14px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.empty h2{margin:0;font-size:17px;font-weight:600}
.empty p{margin:0;color:var(--tx2);max-width:520px;line-height:1.5}
.scard{display:flex;flex-direction:column;gap:6px;text-align:left;width:220px;padding:11px 13px;border:1px solid var(--bd);border-radius:8px;background:#fff;cursor:pointer;border-top:4px solid var(--c)}
.scard:hover{background:#f8fbff;border-color:#b8cde3;border-top-color:var(--c)}
.scard b{font-size:13px}
.scard span{color:var(--tx2);font-size:11.5px}
.txt{white-space:pre;font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:11.5px;line-height:1.5;background:#fbfbfb;border:1px solid var(--bd2);border-radius:6px;padding:10px 12px;overflow:auto;color:#222}
.txt .k{color:#0b4a8c;font-weight:700}
.txt .c{color:#6a737d}
.txt .s{color:#8a3b00}

.cb .fld select.combo{max-width:340px}
.tb .opt{white-space:nowrap}

.rrow .mo{display:none}
.rrow:hover .mo,.rrow.focus .mo{display:inline-flex}
.rrow .nm .fl{display:flex;align-items:center;gap:5px;min-width:0}
.rrow .nm .fl b{min-width:0}
.chgd{width:7px;height:7px;border-radius:4px;background:#b86b00;flex-shrink:0;display:inline-block}
.pr{display:inline-flex;color:#6b5a3a;flex-shrink:0}
.pr svg{width:12px;height:12px}
.scard b{white-space:nowrap}

.grpcell span{font-weight:400;color:#6b6b6b;font-size:11px;margin-left:10px;text-transform:none;letter-spacing:0}
.numf{display:inline-flex;align-items:stretch}
.numf .edit.num{border-top-right-radius:0;border-bottom-right-radius:0}
.spin{display:inline-flex;flex-direction:column;border:1px solid #c8c8c8;border-left:none;border-radius:0 4px 4px 0;overflow:hidden;width:20px}
.spin button{flex:1;border:none;background:#f7f7f7;color:#444;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.spin button+button{border-top:1px solid #e1e1e1}
.spin button:hover{background:#e8e8e8}
.netpic{background:#fffdf3;border:1px solid #efe3b0;border-radius:6px;display:flex;justify-content:center;padding:4px 0}
.side .mk{display:flex;flex-direction:column;gap:3px;font-size:11.5px}
.side .mk div{display:flex;align-items:center;gap:6px}
.side .mk .tyg{display:inline-flex;color:#5a6b7c}
.side .mk .tyg svg{width:14px;height:14px}
.errm{width:14px;height:14px;border-radius:7px;background:#c4262e;color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.win.compact table.g td{height:29px}
.win.compact .tb .b,.win.compact .tb .combo{height:30px}
.win.compact .foot .b{height:32px;min-width:44px;justify-content:center}
.att.lab.part{background:#eef1f5;color:#444}
.toggle.dis{opacity:.5;cursor:default}
.win.compact .plan{flex-direction:column;align-items:stretch}
.win.compact .plan .arrow{transform:rotate(90deg);align-self:center}
.dlg{max-width:calc(100% - 16px)}
.db{flex-wrap:wrap;row-gap:6px}
.hvopts .opt{align-items:flex-start}
.hvopts .opt input{margin-top:2px}
/* ---------- v4 ---------- */
/* setup progress on the tabs */
.tst{font-size:10.5px;font-weight:400;color:var(--tx2);margin-left:4px;padding:0 7px;border-radius:9px;background:#f0f0f0;line-height:16px;cursor:pointer}
.tst.warn{background:#fff3d6;color:#8a5300}
.tst.err{background:var(--errbg);color:var(--err)}
.tst.ok{background:none;padding:0;color:var(--ok);display:inline-flex;cursor:default}
.tst.ok svg{width:12px;height:12px}
.tst.dotonly{width:8px;height:8px;padding:0;border-radius:4px;background:#e0a100}
.tst.dotonly.err{background:#c4262e}
.tab .tst:hover{filter:brightness(.96)}
/* action captions next to the sub-tabs */
.subtabs .caption{color:#3d3d3d;font-size:12px}
.subtabs .shr{display:inline-flex;align-items:center;gap:5px;color:var(--tx3);font-size:11px}
.subtabs .shr svg{width:12px;height:12px}
/* status bar: points, segments, hint, save state */
.status .savest{margin-left:auto;border-right:none;color:var(--tx2)}
.status .savest.dirty{color:#8a5300;font-weight:600}
/* issues */
.b.issues{color:#8a5300;border-color:#efd48c;background:#fffaf0}
.b.issues svg{color:#b36b00}
.b.issues.okb{color:var(--ok);border-color:#cbcbcb;background:#fdfdfd}
.b.issues.okb svg{color:var(--ok)}
.issp{gap:6px}
.iss{display:flex;align-items:center;gap:9px;padding:8px 9px;border:1px solid var(--bd2);border-radius:6px;background:#fff;font:inherit;text-align:left;cursor:pointer;line-height:1.4;color:var(--tx)}
.iss:hover{background:var(--hov);border-color:var(--accbd)}
/* hipot groups */
.gtag{display:inline-flex;align-items:center;gap:3px;padding:0 7px;margin-right:4px;border-radius:9px;background:#fff4d0;border:1px solid #efd48c;color:#6a4f00;font-size:11px;line-height:17px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.gtag .x{border:none;background:none;padding:0;margin-left:2px;display:inline-flex;cursor:pointer;color:#8a6d00}
.gtag .x svg{width:10px;height:10px}
td.gcell{overflow:hidden}
.gtags{display:flex;flex-wrap:wrap;gap:4px}
.hvgs{display:flex;height:440px;margin:0;border-bottom:1px solid var(--bd2)}
.hvglist{width:290px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--bd);background:#fbfbfb}
.hvgl{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-bottom:1px solid var(--bd2);cursor:pointer;border-left:3px solid transparent}
.hvgl:hover{background:var(--hov)}
.hvgl.on{background:var(--sel);border-left-color:var(--acc)}
.hvgl b{font-weight:600;display:flex;align-items:center;gap:6px}
.hvgl span{font-size:11px;color:var(--tx2)}
.hvgl .ord{font-size:10px;color:#fff;background:#8a8a8a;border-radius:8px;min-width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center}

/* ===================== v5: one design system =====================
   gray window, white cards, one radius (8), one accent, two text sizes (12, 13) plus titles, 26 px controls, 30 px rows.
   VCL: Windows 11 Light style, TPanel cards with a 1 px border, owner-drawn grids */
:root{--bg:#eef0f3;--card:#fff;--cbd:#e1e4e8;--r:8px;--sh:0 1px 2px rgba(16,24,40,.05);--hov:#f4f8fc;--sel:#e6f0fb}

.title .cap .app{color:#6b7480;white-space:nowrap}
.dirtydot{width:7px;height:7px;border-radius:4px;background:#b86b00;margin-left:7px;flex-shrink:0}

.tq:hover{background:#dfe3e8}.tq:disabled{color:#b0b6bd;cursor:default;background:transparent}
.tq svg{width:16px;height:16px}.tqs{display:inline-flex}.tq.dd{width:16px}
.cmdbox{display:flex;align-items:center;gap:8px;width:300px;height:28px;border:1px solid #d3d8de;border-radius:7px;background:#fff;color:#6b7480;font:inherit;padding:0 6px 0 9px;cursor:text;margin-right:6px}
.cmdbox:hover{border-color:#a9b4c0}.cmdbox span{flex:1;text-align:left}
kbd{font:600 10px "Segoe UI",EWUI,sans-serif;border:1px solid #cfd5db;border-bottom-width:2px;border-radius:4px;padding:0 5px;color:#5b6570;background:#fff;line-height:15px}
.win.compact .cmdbox{width:118px}.win.compact .cmdbox kbd{display:none}.win.compact .qa{margin:0 2px;padding-right:4px}
/* step tabs */
.tabs{gap:4px;padding:2px 0 7px 0;align-items:center}
.tab{padding:5px 12px 5px 6px;border:none;border-radius:8px;background:transparent;font-size:13px;color:#4b5560;gap:8px}

.tab .num{width:21px;height:21px;border-radius:11px;border:1.5px solid #a2acb6;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#6b7480;margin:0}
.tab.on{background:#fff;border:none;margin-bottom:0;box-shadow:var(--sh),0 0 0 1px var(--cbd);color:var(--tx)}
.tab.on::after{display:none}
.tab.on .num{background:var(--tabc,var(--acc));border-color:var(--tabc,var(--acc));color:#fff}
.win.compact .tab{padding:4px 9px 4px 5px;font-size:12px}
/* page: a header card, then cards for each pane */
.page{background:transparent;border:none;border-radius:0;overflow:visible}
.page>.subtabs,.page>.tb,.page>.probe,.page>.segbar{background:#fff;border:1px solid var(--cbd);border-top:none}
.page>:first-child{border-top:1px solid var(--cbd)!important;border-radius:var(--r) var(--r) 0 0}
.page>.subtabs:not(:has(+ .tb)),.page>.tb:not(:has(+ .tb)):not(:has(+ .probe)){border-radius:0 0 var(--r) var(--r);box-shadow:var(--sh)}
.page>.subtabs:first-child:not(:has(+ .tb)),.page>.tb:first-child:not(:has(+ .tb)){border-radius:var(--r)}
.page>.split{margin-top:8px;gap:8px}
.split{gap:8px}
.split>.pane{background:#fff;border:1px solid var(--cbd);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.split>.pane+.pane{border-left:1px solid var(--cbd)}
.split>.side,.split>.sidecol{background:#fff;border:1px solid var(--cbd);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.subtabs{background:#fff;padding:7px 10px;min-height:44px}
.subtabs .caption{font-size:12.5px;color:#4b5560}
.subnote{gap:8px}.subtabs .chip{font-size:11.5px}
.tb{min-height:42px;padding:6px 10px}
/* rail: segment color down the edge of every card */

.findpin{display:flex;align-items:center;gap:4px;height:24px;width:66px;border:1px solid #cfd5db;border-radius:6px;background:#fff;padding:0 6px;color:#6b7480}

.zv{font-size:10.5px;color:#5b6570;min-width:32px;text-align:center}

.gstrip>b{white-space:nowrap}.gstrip .gt{color:#2b3640;line-height:1.35}

.gstrip.intro{background:#f4f8fc;border-color:#d3e3f3;gap:12px}
.gi3{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#2b3640}
.gi3 i{font-style:normal;width:16px;height:16px;border-radius:8px;background:var(--acc);color:#fff;font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.gpill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:#eaf3fd;border:1px solid #b9d6f3;color:#0b4a8c;border-radius:13px;padding:3px 11px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
.gl{box-shadow:0 0 0 3px rgba(0,95,184,.25),0 0 14px rgba(0,95,184,.35)!important}
/* start screen */
.start{inset:38px 0 0}
.cards{display:grid;grid-template-columns:repeat(2,310px);gap:12px}
.empty.sm{flex:1;padding:16px}.empty.sm p{font-size:12px}
/* colors in use are marked */
.swatch{position:relative}
.swatch.used::after{content:"";position:absolute;right:2px;bottom:2px;width:6px;height:6px;border-radius:3px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.lnk.sm{font-size:11.5px}
.dlg{border-radius:10px}
.menu{border-radius:9px}
.subtabs .caption{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.subnote{flex-shrink:0;white-space:nowrap;margin-left:auto}
.legend span{white-space:nowrap}
.dlg .db .b.ico{min-width:34px;width:34px;padding:0}
@container (max-width:470px){.pichead{flex-wrap:wrap;row-gap:6px}.pic .picmeta{flex-basis:100%}.pic .pictools{margin-left:auto}}
@container (max-width:340px){.pic .tl,.zv{display:none}}
.sethead .hc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:1}
.sethead>*:not(.hc){flex-shrink:0}
table.g tr.gh.tgt td{background:#eef5fc}
table.g tr.gh .chev{width:20px;height:20px}
.b.gnext{color:#0b4a8c;font-weight:600;border-color:#9fc3e8}

.sethead .hc{white-space:normal;line-height:1.35}
.subtabs .caption{white-space:normal;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:12px}
.colhead span:first-child{margin-left:auto}
.match{background:#fff6d6;border-radius:6px;box-shadow:0 0 0 4px #fff6d6}
@keyframes fl{0%{background:#cfe4fb}100%{background:transparent}}
body.shot .flash{background:#e1eefb;box-shadow:0 0 0 4px #e1eefb}
.toast{bottom:56px}
.rrow.droplinea{box-shadow:inset 0 -3px 0 var(--acc)}
table.g tr.droplinea td{box-shadow:inset 0 -2px 0 var(--acc)}
.addbar .al{max-width:190px;overflow:hidden;text-overflow:ellipsis}.addbar .al b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sethead{position:sticky;top:-2px;z-index:4;background:var(--bg);margin:0 0 8px;padding:2px 2px 4px}

/* connector pictures, drawn from the connector database (pin positions per part). Every pin carries data-pin so it can light up with the same pin anywhere else on screen */
let PIC_REF = '';
function pinG(n, x, y, r, st, shape) {
  const fill = st.bad ? '#c4262e' : (st.att ? (st.fill || '#2f6db5') : '#fff');
  const tx = st.att || st.bad ? '#fff' : '#5d6b78';
  const stc = st.bad ? '#a11f26' : (st.att ? (st.fill || '#2f6db5') : '#7a8a99');
  const ringShape = (pad, attrs) => (shape === 'sq' ? `<rect x="${x - r - pad}" y="${y - r - pad}" width="${2 * (r + pad)}" height="${2 * (r + pad)}" rx="${4 + pad / 2}" ${attrs}/>` : `<circle cx="${x}" cy="${y}" r="${r + pad}" ${attrs}/>`);
  const ring = st.wait ? ringShape(4, 'class="waitring" fill="none" stroke="#e08a00" stroke-width="2.4" stroke-dasharray="3.5 2.5"') : (st.sel ? ringShape(4, 'fill="none" stroke="#1a1a1a" stroke-width="2.2"') : '');
  const hi = ringShape(4, 'class="hiring" fill="none" stroke="#f2a000" stroke-width="3"');
  const body = shape === 'sq' ? `<rect x="${x - r}" y="${y - r}" width="${2 * r}" height="${2 * r}" rx="3" fill="${fill}" stroke="${stc}" stroke-width="1.4"/>` : `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stc}" stroke-width="1.4"/>`;
  return `<g class="pin" data-a="pin" data-id="${n}" data-pin="${esc(PIC_REF + '-' + n)}" data-ctx="pin">${hi}${ring}${body}<text x="${x}" y="${y + 3.6}" text-anchor="middle" font-size="${r > 9 ? 10.5 : 9}" font-weight="600" fill="${tx}" font-family="Segoe UI,EWUI,sans-serif">${n}</text></g>`;
}
const SHADOW = '<defs><filter id="psh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#1d2b3a" flood-opacity=".18"/></filter></defs>';
function connPicture(c, st) {
  PIC_REF = c.ref;
  const s = (n) => st(n);
  const z = S.zoom || 1;
  const svg = (W, H, inner) => `<svg class="conn" viewBox="0 0 ${W} ${H}" style="width:${Math.round(W * z)}px;${z > 1 ? '' : 'max-width:100%;'}height:auto">${SHADOW}${inner}</svg>`;
  if (c.pic === 'dsub15') {
    let p = ''; const W = 400, H = 136;
    for (let i = 0; i < 8; i++) p += pinG(i + 1, 88 + i * 32, 50, 11, s(i + 1));
    for (let i = 0; i < 7; i++) p += pinG(i + 9, 104 + i * 32, 88, 11, s(i + 9));
    return svg(W, H, `<g filter="url(#psh)"><rect x="6" y="14" width="${W - 12}" height="${H - 28}" rx="12" fill="#e4e9ee" stroke="#8b97a3" stroke-width="1.4"/></g><circle cx="34" cy="68" r="9" fill="#fff" stroke="#8b97a3" stroke-width="1.4"/><circle cx="${W - 34}" cy="68" r="9" fill="#fff" stroke="#8b97a3" stroke-width="1.4"/><path d="M64 26 H336 Q346 26 344 36 L328 106 Q326 112 318 112 H82 Q74 112 72 106 L56 36 Q54 26 64 26 Z" fill="#fbfcfd" stroke="#6c7a88" stroke-width="1.6"/>${p}`);
  }
  if (c.pic === 'mnl6' || c.pic === 'mnl8') {
    const cols = c.pic === 'mnl6' ? 3 : 4; const W = 70 + cols * 44, H = 150;
    let p = '';
    for (let i = 0; i < cols; i++) { p += pinG(i + 1, 57 + i * 44, 66, 13, s(i + 1), 'sq'); p += pinG(cols + i + 1, 57 + i * 44, 110, 13, s(cols + i + 1), 'sq'); }
    return svg(W, H, `<rect x="${W / 2 - 22}" y="14" width="44" height="18" rx="4" fill="#efe7d6" stroke="#9d8f74" stroke-width="1.4"/><g filter="url(#psh)"><rect x="18" y="30" width="${W - 36}" height="${H - 42}" rx="8" fill="#f6f1e6" stroke="#9d8f74" stroke-width="1.6"/></g>${p}`);
  }
  if (c.pic === 'euro32') {
    const W = 470, H = 120; let p = '';
    for (let i = 0; i < 16; i++) { p += pinG(2 * i + 1, 52 + i * 26, 46, 9, s(2 * i + 1)); p += pinG(2 * i + 2, 52 + i * 26, 80, 9, s(2 * i + 2)); }
    return svg(W, H, `<g filter="url(#psh)"><rect x="6" y="18" width="${W - 12}" height="${H - 36}" rx="10" fill="#e4e9ee" stroke="#8b97a3" stroke-width="1.4"/></g><rect x="34" y="26" width="${W - 68}" height="${H - 52}" rx="6" fill="#fbfcfd" stroke="#6c7a88" stroke-width="1.4"/><circle cx="20" cy="60" r="6" fill="#fff" stroke="#8b97a3"/><circle cx="${W - 20}" cy="60" r="6" fill="#fff" stroke="#8b97a3"/>${p}`);
  }
  /* no picture in the database: a plain numbered layout for the pin count */
  const cols = Math.min(c.pins, c.pins > 12 ? 16 : 6); const rows = Math.ceil(c.pins / cols);
  const W = 40 + cols * 36, H = 34 + rows * 36 + 6; let p = '';
  for (let n = 1; n <= c.pins; n++) { const r = Math.floor((n - 1) / cols), k = (n - 1) % cols; p += pinG(n, 38 + k * 36, 34 + r * 36, 12, s(n), 'sq'); }
  return svg(W, H, `<rect x="6" y="8" width="${W - 12}" height="${H - 14}" rx="8" fill="none" stroke="#a7b1bb" stroke-width="1.4" stroke-dasharray="5 4"/>${p}`);
}
function labelOf(pin) { return (S.d.labels || {})[pin] || ''; }
/* connector list: two lines per connector (ref over part number), so long part numbers never get cut off */
function connList(selIdx, act, vm, lab) {
  const fs = focusSeg();
  return S.d.conns.map((c, i) => {
    const a = lab ? c.att.filter((x, k) => labelOf(c.ref + '-' + (k + 1))).length : c.att.filter((x) => x).length;
    const us = usersOf(c.ref);
    const dim = (vm === 'seg' && fs && us.indexOf(fs) < 0);
    const cc = multi() ? connColor(c.ref) : null;
    return `<div class="crow ${selIdx === i ? 's' : ''} ${dim ? 'dim' : ''}" data-a="${act}" data-id="${i}" style="--c:${cc || 'transparent'}" title="${esc(c.ref + ' · ' + c.pn)}"><span class="cl"><b>${esc(c.ref)}${noteIc('conn:' + c.ref)}</b><span>${esc(c.pn)}</span></span><span class="att">${a}/${c.pins}</span></div>`;

}
/* the picture scales to fit its column and never draws outside it; zoom and find pin for big connectors. A narrow column hides it (VCL: OnResize) */
function picBlock(c, st, opts) {
  opts = opts || {};
  const hasPic = !!c.pic;
  const legend = `<div class="legendp"><span><i class="lg a" style="${opts.fill ? 'background:' + opts.fill + ';border-color:' + opts.fill : ''}"></i>${opts.lab ? 'Labeled' : 'Attached'}</span><span><i class="lg"></i>${opts.lab ? 'No label' : 'Not attached'}</span></div>`;
  const tools = `<div class="pictools"><div class="findpin" title="Find a pin: type its number">${ic('search', 12)}<input data-f="findPin" placeholder="Pin" value="${esc(S.findPin)}"></div><span class="zm"><button class="ib" data-a="zoomOut" title="Zoom out (Ctrl+-)" ${S.zoom <= 1 ? 'disabled' : ''}>${IC.zoomout}</button><span class="zv">${Math.round(S.zoom * 100)}%</span><button class="ib" data-a="zoomIn" title="Zoom in (Ctrl++ or Ctrl+wheel)" ${S.zoom >= 3 ? 'disabled' : ''}>${IC.zoomin}</button></span><span class="toggle ${S.showPic ? 'on' : ''}" data-a="togPic" title="Show or hide the connector picture"><span class="sw"></span><span class="tl">Picture</span></span></div>`;
  const head = `<div class="pichead"><div class="picmeta"><b>${esc(c.ref)} · ${esc(c.pn)}</b>${S.compact ? '' : `<span>${opts.sub || (hasPic ? 'From the Connector Registry · viewed from the pin insertion side' : 'No picture in the Connector Registry: numbered layout for ' + c.pins + ' pins')}</span>`}</div>${tools}</div>`;
  if (!S.showPic) return `<div class="pic off">${head}</div>`;
  return `<div class="pic">${head}<div class="picarea ${S.zoom > 1 ? 'zoomed' : ''}">${connPicture(c, st)}</div><div class="picnarrow">Picture hidden: the column is too narrow. Widen the window to see it.</div>${S.compact ? '' : legend}${opts.extra || ''}</div>`;
}
function tbAttachModes() {

}
function attachPage(vm) {

  const rows = c.att.map((pt, k) => {
    const n = k + 1; const lab = labelOf(c.ref + '-' + n);

    return `<tr class="r ${S.attPin === n ? 's' : ''}" data-a="attPin" data-id="${n}" data-pin="${esc(c.ref + '-' + n)}" data-ctx="pin"><td>${n}</td><td style="padding:1px 4px"><input class="cellin" data-f="attPt" data-id="${n}" value="${pt || ''}" placeholder="${S.probe && S.attPin === n ? '' : '–'}"></td><td>${status}</td><td style="color:#5d5d5d">${esc(lab)}</td></tr>`;
  }).join('');
  const open = c.att.map((x, i) => (!x && i + 1 !== S.attPin ? i + 1 : 0)).filter(Boolean);

  const right = S.compact ? '' : `<div class="pane" style="width:212px;flex-shrink:0"><div class="colhead">Tester points</div><div style="padding:8px 10px;overflow:auto;flex:1">${pointMap(focusSeg(), c)}</div></div>`;

  <div class="split"><div class="pane" style="width:${S.compact ? 170 : 236}px;flex-shrink:0"><div class="colhead">Connectors<span>Attached</span></div><div class="clist">${connList(S.attConn, 'attConn', vm)}</div></div>
  <div class="pane picpane" style="flex:1">${picBlock(c, st, { fill: cc })}${probeBar}
   <div class="grid" data-keepscroll><table class="g"><colgroup><col style="width:52px"><col style="width:120px"><col style="width:${S.probe ? 160 : 70}px"><col></colgroup><tr><th>Pin</th><th>Tester point</th><th>Status</th><th>Label</th></tr>${rows}</table></div>
   ${firstOpen && !S.probe ? `<div class="paneft"><button class="lnk" data-a="probeFrom" data-id="${firstOpen}">Probe from pin ${firstOpen}</button></div>` : ''}
  </div>${right}</div>`;
}
function pointMap(fs, selC) {

function hexHsl(h) {

  const q = new URLSearchParams(location.search).get('shot');
  if (q) { document.body.classList.add('shot'); tour.classList.add('hide'); window.__applyPreset(q); return; }
  tour.innerHTML = `<b>Easy-Wire Test Program Editor · concept v5</b><span style="color:#555">Clickable mockup, not the real software.</span><span style="flex:1"></span><span>Jump to</span><select id="jump"><option value="">Choose a screen…</option>${PRESETS.map((p) => `<option value="${p[0]}">${p[0].slice(0, 2)}. ${esc(p[1])}</option>`).join('')}</select><button class="b std" id="restart">Start over</button>`;
  document.getElementById('jump').addEventListener('change', (e) => { if (e.target.value) window.__applyPreset(e.target.value); });
  document.getElementById('restart').addEventListener('click', () => { S.screen = 'start'; S.d = null; S.compact = false; S.dlg = null; render(); });
  render();
}
boot();
</script></body></html>
