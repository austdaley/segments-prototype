<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy-Wire Test Editor Concept v2</title>
<style>:root{--acc:#005fb8;--acc2:#e5f0fb;--bd:#d1d1d1;--bd2:#e5e5e5;--tx:#1b1b1b;--tx2:#5c5c5c;--bg:#f3f3f3;--pane:#ffffff;--hov:#eaf2fb;--sel:#cce4f7;--warn:#9d5d00;--warnbg:#fff4ce;--err:#a4262c;--errbg:#fde7e9}
*{box-sizing:border-box}
html,body{margin:0;background:#dcdfe3;font-family:"Segoe UI",Tahoma,sans-serif;font-size:12px;color:var(--tx)}
body.shot{background:#fff}
.tour{max-width:1124px;margin:10px auto 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#333}
.tour b{font-size:13px}
.tour select{font:inherit;padding:3px 6px}
.stage{display:flex;justify-content:center;padding:0 8px 16px}
body.shot .stage{padding:0}
.win{width:1120px;height:720px;background:var(--bg);border:1px solid #8c8c8c;box-shadow:0 6px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;position:relative;overflow:hidden}
.win.compact{width:640px;height:480px}
body.shot .win{box-shadow:none}
.title{height:30px;background:#fff;display:flex;align-items:center;gap:8px;padding-left:10px;flex-shrink:0}
.title .ico{width:16px;height:16px;border-radius:3px;background:#c4262e;color:#fff;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center}
.title .cap{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .wb{width:44px;height:30px;display:flex;align-items:center;justify-content:center;color:#333}
.title .wb:hover{background:#e9e9e9}
.title .wb.x:hover{background:#c42b1c;color:#fff}
.body{flex:1;display:flex;min-height:0;padding:6px 6px 0 6px;gap:6px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;gap:1px;padding-left:2px;flex-shrink:0}
.tab{padding:6px 11px 6px;border:1px solid transparent;border-bottom:none;background:transparent;font:inherit;color:var(--tx2);cursor:pointer;border-radius:4px 4px 0 0;position:relative;white-space:nowrap}
.tab:hover{background:#e8e8e8;color:var(--tx)}
.tab.on{background:var(--pane);border-color:var(--bd);color:var(--tx);font-weight:600;margin-bottom:-1px;z-index:1}
.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:2px;height:2px;border-radius:2px;background:var(--tabc,var(--acc))}
.page{flex:1;background:var(--pane);border:1px solid var(--bd);border-radius:0 4px 4px 4px;display:flex;flex-direction:column;min-height:0;position:relative}
.segbar{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--bd2);font-size:12px;flex-shrink:0}
.segbar .chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 6px;border-radius:10px;color:#fff;font-weight:600}
.stripe{height:3px;flex-shrink:0}
.tb{display:flex;align-items:center;gap:2px;padding:5px 8px;border-bottom:1px solid var(--bd2);flex-wrap:nowrap;flex-shrink:0}
.tb .sep{width:1px;height:20px;background:var(--bd);margin:0 5px}
.tb .sp{flex:1}
.b{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border:1px solid transparent;border-radius:4px;background:transparent;font:inherit;color:var(--tx);cursor:pointer;white-space:nowrap}
.b:hover{background:#ebebeb;border-color:#e0e0e0}
.b:disabled{color:#a0a0a0;cursor:default;background:transparent;border-color:transparent}
.b svg{width:16px;height:16px;flex-shrink:0}
.b.pri{background:var(--acc);color:#fff;border-color:#004c93}
.b.pri:hover{background:#0067c0}
.b.std{background:#fdfdfd;border-color:#c9c9c9;padding:0 14px}
.b.std:hover{background:#f0f0f0}
.b.seg{background:#eef5fc;border-color:#b6d4f2;color:#0b4a8c;font-weight:600}
.b.on{background:var(--sel);border-color:#9cc8ee}
.combo{height:26px;border:1px solid #c9c9c9;border-radius:4px;background:#fff;font:inherit;padding:0 6px;color:var(--tx)}
.search{display:flex;align-items:center;gap:4px;height:26px;border:1px solid #c9c9c9;border-radius:4px;background:#fff;padding:0 6px;width:200px;color:var(--tx2)}
.search input{border:none;outline:none;font:inherit;flex:1;min-width:0;background:transparent}
.grid{flex:1;overflow:auto;min-height:0;position:relative}
table.g{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
table.g th{position:sticky;top:0;background:#fafafa;text-align:left;font-weight:400;color:var(--tx2);border-bottom:1px solid var(--bd);padding:4px 6px;height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
table.g th+th{border-left:1px solid var(--bd2)}
table.g td{padding:0 6px;height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #f2f2f2}
table.g tr.r{cursor:default}
table.g tr.r:hover td{background:var(--hov)}
table.g tr.r.s td{background:var(--sel)}
table.g td.bar{padding:0;width:5px}
table.g tr.dim td{color:#9a9a9a}
table.g tr.end td{color:var(--tx2)}
.foot{display:flex;align-items:center;gap:8px;padding:6px 6px;flex-shrink:0}
.foot .sp{flex:1}
.status{height:24px;display:flex;align-items:center;gap:0;border-top:1px solid var(--bd);background:#f9f9f9;font-size:11.5px;color:#444;flex-shrink:0}
.status span{padding:0 10px;border-right:1px solid var(--bd2);white-space:nowrap;display:flex;align-items:center;gap:5px}
.status span:last-child{border-right:none}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block;flex-shrink:0}
.rail{width:236px;flex-shrink:0;background:var(--pane);border:1px solid var(--bd);border-radius:4px;display:flex;flex-direction:column;min-height:0}
.rail h3{margin:0;font-size:12.5px;font-weight:600;padding:9px 10px 2px;display:flex;align-items:center}
.rail .hint{font-size:11px;color:var(--tx2);padding:0 10px 6px;line-height:1.35}
.rrow{display:flex;align-items:flex-start;gap:6px;padding:6px 6px 6px 8px;border-left:4px solid transparent;cursor:pointer;position:relative}
.rrow:hover{background:var(--hov)}
.rrow.focus{background:var(--rbg)}
.rrow .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rrow .nm b{font-weight:600}
.rrow .nm span{font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .nm .off{color:#9a9a9a;text-decoration:line-through}
.ib{width:24px;height:22px;border:1px solid transparent;border-radius:4px;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#444;flex-shrink:0;padding:0}
.ib:hover{background:#e3e3e3}
.ib svg{width:16px;height:16px}
.ib.offeye{color:#b0b0b0}
.rail .ft{border-top:1px solid var(--bd2);padding:8px;display:flex;flex-direction:column;gap:6px}
.chk{width:15px;height:15px;margin:1px 0 0;accent-color:var(--acc);flex-shrink:0}
.menu{position:absolute;background:#fff;border:1px solid #c4c4c4;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;z-index:30;min-width:200px}
.menu .mi{display:flex;align-items:center;gap:8px;width:100%;padding:5px 10px;border:none;background:transparent;font:inherit;border-radius:4px;cursor:pointer;text-align:left;color:var(--tx)}
.menu .mi:hover{background:var(--hov)}
.menu .mi svg{width:16px;height:16px;color:#555}
.menu .mi .k{margin-left:auto;color:#888;font-size:11px}
.menu .mi.danger{color:var(--err)}
.menu hr{border:none;border-top:1px solid var(--bd2);margin:4px 2px}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;z-index:40}
.dlg{background:#fff;border:1px solid #8c8c8c;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:96%;overflow:hidden}
.dlg .dt{height:32px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;border-bottom:1px solid var(--bd2)}
.dlg .dt .cap{flex:1}
.dlg .dc{padding:14px 16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.dlg .db{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;background:#f7f7f7;border-top:1px solid var(--bd2)}
.dlg .db .b{min-width:84px;justify-content:center}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>label,.lbl{font-weight:600;font-size:12px}
.edit{height:26px;border:1px solid #c9c9c9;border-bottom-color:#8a8a8a;border-radius:4px;padding:0 7px;font:inherit;background:#fff;color:var(--tx)}
.edit:disabled{background:#f5f5f5;color:#8a8a8a;border-bottom-color:#c9c9c9}
.edit.num{width:110px}
.radio{display:flex;align-items:center;gap:7px;cursor:pointer}
.radio input{accent-color:var(--acc);margin:0}
.info{display:block;padding:8px 10px;border-radius:4px;background:#eef5fc;border:1px solid #c7def5;line-height:1.4}
.info.warn{background:var(--warnbg);border-color:#f0d58a}
.info.err{background:var(--errbg);border-color:#f1b8bd}
.info svg{width:16px;height:16px;vertical-align:-3px;margin-right:7px}
.dtabs{display:flex;gap:2px;padding:8px 16px 0}
.cat{border:1px solid var(--bd);border-radius:6px;background:#fff}
.cat+.cat{margin-top:8px}
.cat .ch{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;border-radius:6px}
.cat .ch:hover{background:#f6f6f6}
.cat .ch .t{font-weight:600;min-width:150px}
.cat .ch .sum{flex:1;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .ch .badge{font-size:11px;padding:0 7px;border-radius:9px;background:var(--warnbg);color:var(--warn);font-weight:600}
.cat .cb{border-top:1px solid var(--bd2);padding:10px 12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 22px}
.cat .cb.one{grid-template-columns:1fr}
.prow{display:grid;grid-template-columns:minmax(150px,220px) 120px 1fr;align-items:center;gap:8px;min-height:26px}
.prow .src{font-size:11px;color:var(--tx2)}
.prow.chg{background:#fff8e6;border-radius:4px;margin:0 -6px;padding:0 6px}
.prow.chg .src{color:var(--warn);font-weight:600}
.prow.dis{opacity:.45}
.opt{display:flex;align-items:center;gap:7px}
.opt input{accent-color:var(--acc);margin:0}
.toggle{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.toggle .sw{width:34px;height:18px;border-radius:9px;border:1px solid #6b6b6b;background:#fff;position:relative;flex-shrink:0}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:10px;height:10px;border-radius:5px;background:#555}
.toggle.on .sw{background:var(--acc);border-color:var(--acc)}
.toggle.on .sw::after{left:19px;background:#fff}
.side{width:230px;flex-shrink:0;border-left:1px solid var(--bd2);display:flex;flex-direction:column;background:#fbfbfb}
.side h4{margin:0;padding:8px 10px;font-size:12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--bd2)}
.side .sb{padding:8px 10px;overflow:auto;display:flex;flex-direction:column;gap:9px}
.side .kv{display:grid;grid-template-columns:86px 1fr;gap:2px 6px;font-size:11.5px}
.side .kv span:nth-child(odd){color:var(--tx2)}
.side .sec{font-weight:600;font-size:11.5px;display:flex;align-items:center;gap:6px}
.side .chg{color:var(--warn);font-weight:600}
.sidecol{width:22px;flex-shrink:0;border-left:1px solid var(--bd2);display:flex;flex-direction:column;align-items:center;padding-top:6px;background:#fbfbfb}
.vt{writing-mode:vertical-rl;font-size:11px;color:var(--tx2);margin-top:8px}
.plan{display:flex;gap:10px;flex-wrap:wrap}
.step{flex:1 1 220px;border:1px solid var(--bd);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;background:#fff}
.step .sh{font-weight:600;display:flex;gap:6px;align-items:center}
.step .why{font-size:11px;color:var(--tx2)}
.pts{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:2px}
.pt{height:20px;font-size:9.5px;display:flex;align-items:center;justify-content:center;border-radius:2px;background:#ececec;color:#777}
.swatch{width:26px;height:22px;border-radius:4px;cursor:pointer;border:2px solid transparent}
.swatch.on{border-color:#1b1b1b;box-shadow:inset 0 0 0 2px #fff}
.undo{display:flex;align-items:center;gap:10px;padding:6px 10px;background:#eef5fc;border-bottom:1px solid #c7def5;flex-shrink:0}
.undo .sp{flex:1}
.ann{position:absolute;right:8px;bottom:8px;background:#fffbe6;border:1px solid #e9d27a;border-radius:4px;padding:4px 8px;font-size:11px;color:#6b5600;z-index:5}
.hide{display:none!important}
.lnk{color:var(--acc);background:none;border:none;font:inherit;padding:0;cursor:pointer;text-decoration:underline}
.mono{font-family:Consolas,monospace}
.colhead{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;font-weight:600;border-bottom:1px solid var(--bd2)}
.colhead span{font-weight:400;color:var(--tx2)}
.split{flex:1;display:flex;min-height:0}
.split>.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.split>.pane+.pane{border-left:1px solid var(--bd)}
.start{position:absolute;inset:30px 0 0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.card{width:300px;text-align:left;padding:14px 16px;background:#fff;border:1px solid var(--bd);border-radius:8px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:5px}
.card:hover{border-color:var(--acc);background:#f6faff}
.card b{font-size:14px}
.subtabs{display:flex;align-items:center;gap:4px;padding:6px 8px 0;border-bottom:1px solid var(--bd2);flex-shrink:0}
.sub{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 6px;border:none;background:transparent;font:inherit;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.sub:hover{color:var(--tx);background:#f4f4f4;border-radius:4px 4px 0 0}
.sub.on{color:var(--tx);font-weight:600;border-bottom-color:var(--acc)}
.subnote{margin-left:auto;color:var(--tx2);font-size:11.5px;padding-right:4px}
</style></head>
<body><div class="tour" id="tour"></div><div class="stage" id="app"></div>

function connsOfList(list) { const r = []; list.forEach((i) => [connOf(i.f), connOf(i.to)].forEach((c) => { if (r.indexOf(c) < 0) r.push(c); })); return r; }

/* run plan: shared pins, shared wiring, LV settings, prompts force separate steps */
function runPlan() {
  const steps = [];
  segs().filter((s) => s.on).forEach((s) => {
    const cs = segConns(s);
    const lvKey = LVP.map((p) => sv(s, p.k)).join('|');
    let reason = '';
    let placed = false;
    if (!s.prompt && !s.base) {
      for (const st of steps) {
        if (st.solo) continue;
        const clash = st.segs.find((o) => segConns(o).some((c) => cs.indexOf(c) >= 0));
        const lvClash = st.segs.find((o) => LVP.map((p) => sv(o, p.k)).join('|') !== lvKey);
        if (!clash && !lvClash) { st.segs.push(s); placed = true; break; }
        if (!reason) reason = clash ? 'Shares ' + segConns(clash).filter((c) => cs.indexOf(c) >= 0).join(', ') + ' with ' + lbl(clash) : 'Different LV settings from ' + lbl(lvClash);
      }
    }
    if (!placed) {
      if (s.base) reason = 'Uses shared wiring, so it shares those pins';
      else if (s.prompt) reason = 'Waits for the operator (prompt)';
      steps.push({ segs: [s], solo: !!(s.prompt || s.base), reason: reason || 'First step' });
    }
  });
  return steps;
}
function planWhy(st) {
  if (st.segs.length > 1) {
    const hv = st.segs.some((s) => HVP.some((p) => s.ov[p.k] !== undefined));
    return 'No shared pins and the same LV settings, so one pass covers them all' + (hv ? '. Different HV values are applied per net.' : '.');
  }
  return st.reason;
}

function netsPage(vm) {
  const scope = scopeSegs(vm);
  const m = multi();
  const rows = [];
  let nn = 1;
  const addNets = (list, s) => {
    const parent = {};
    const find = (x) => { while (parent[x] !== x) x = parent[x] = parent[parent[x]]; return x; };
    list.forEach((i) => { if (['WIRE', 'TWISTED PAIR'].indexOf(i.t) < 0) return; [i.f, i.to].forEach((p) => { if (parent[p] === undefined) parent[p] = p; }); const a = find(i.f), b = find(i.to); if (a !== b) parent[a] = b; });
    const g = {}; Object.keys(parent).forEach((p) => { (g[find(p)] = g[find(p)] || []).push(p); });
    Object.keys(g).forEach((k) => rows.push({ name: 'Net' + nn++, pts: g[k].sort(), s, hv: s && s.ov.dw ? 'Group 2 (' + s.ov.dw + ')' : 'Default' }));
  };

  const showSeg = m && vm !== 'seg' && vm !== 'base';

  return `<div class="tb">${sub}${btn('info', 'Details', 'noop', { tip: 'Net details' })}${btn('hv', 'HV for Selected ▾', 'dd', { id: 'hvctl', tip: 'HV control: Off, On, High Cap' })}<div class="sp"></div>${S.compact ? '' : `<div class="search" style="width:170px">${IC.search.replace('<svg', '<svg width="14" height="14"')}<input placeholder="Search nets"></div>`}${btn('text', S.compact ? '' : 'Text View', 'noop', { tip: 'Text View of the nets' })}${btn('more', S.compact ? '' : 'More', 'dd', { id: 'netmore', tip: 'Customize High Voltage Test By Net' })}</div>
  ${vm === 'seg' && focusSeg().base ? `<div class="segbar" style="color:#555">${dot(BASEC)} Includes shared wiring nets. This is what the tester expects while this segment runs.</div>` : ''}
  <div class="grid"><table class="g"><colgroup>${m ? '<col style="width:5px">' : ''}<col style="width:90px"><col style="width:50px"><col><col style="width:140px">${showSeg ? '<col style="width:130px">' : ''}</colgroup><tr>${m ? '<th></th>' : ''}<th>Name</th><th>Count</th><th>Points</th><th>Hipot Parameter Group</th>${showSeg ? '<th>Segment</th>' : ''}</tr>${tr}</table></div>`;
}

function labelsPage(vm) {
